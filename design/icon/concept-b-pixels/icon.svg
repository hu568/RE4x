<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6FC9F8"/>
      <stop offset="0.5" stop-color="#3D93EC"/>
      <stop offset="1" stop-color="#1B5DC4"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="skyB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF7FF"/>
      <stop offset="1" stop-color="#BFE3FF"/>
    </linearGradient>
    <radialGradient id="softsh" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#0A3A8C" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0A3A8C" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect x="110" y="46" width="100" height="100" rx="18"/></clipPath>
  </defs>

  <!-- backplate -->
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#bg)"/>
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#gloss)"/>
  <rect x="13.5" y="13.5" width="229" height="229" rx="52.5" fill="none" stroke="url(#edge)" stroke-width="3"/>

  <ellipse cx="160" cy="160" rx="82" ry="18" fill="url(#softsh)"/>

  <!-- pixel ramp: low-res blocks growing into the card (drawn behind it) -->
  <rect x="36" y="192" width="28" height="28" rx="4" fill="#FFFFFF" opacity="0.78"/>
  <rect x="58" y="148" width="48" height="48" rx="5" fill="#FFFFFF"/>

  <!-- enhanced photo card -->
  <rect x="104" y="40" width="112" height="112" rx="24" fill="#FFFFFF"/>
  <g clip-path="url(#card)">
    <rect x="110" y="46" width="100" height="100" fill="url(#skyB)"/>
    <circle cx="136" cy="74" r="10" fill="#FFD75E"/>
    <path d="M 104 146 L 144 96 L 184 146 Z" fill="#83B5F0"/>
    <path d="M 134 146 L 172 108 L 210 146 Z" fill="#4A8BDD"/>
  </g>

  <!-- sparkles -->
  <path d="M 58 42 Q 58 62 78 62 Q 58 62 58 82 Q 58 62 38 62 Q 58 62 58 42 Z" fill="#FFFFFF"/>
  <path d="M 90 32 Q 90 40 98 40 Q 90 40 90 48 Q 90 40 82 40 Q 90 40 90 32 Z" fill="#FFFFFF" opacity="0.95"/>
</svg>
